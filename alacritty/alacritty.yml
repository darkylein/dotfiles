# Import other configs
import:
  - ~.config/alacritty/color-theme.yml

scrolling:
  history: 10000
  multiplier: 3

# Font configuration
font:
  normal:
    family: FiraMono Nerd Font
    style: Regular
  medium:
    family: FiraMono Nerd Font
    style: Medium
  bold:
    family: FiraMono Nerd Font
    style: Bold 
  size: 13.0
