# You can get the names of your inputs by running: swaymsg -t get_inputs
# Read `man 5 sway-input` for more information about this section.

# Keyboard
input type:keyboard {
    xkb_layout de
    xkb_capslock 0
    xkb_numlock 1
}

# Touchpad
input type:touchpad {
    tap enabled
    accel_profile adaptive
    pointer_accel 0
}


# Mouse
input type:mouse {
    accel_profile flat
    pointer_accel 0
}
